name: Cross-platform tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Verify installed command
        run: clawpatch-supervise --version
      - name: Test Linux installer
        if: runner.os == 'Linux'
        shell: bash
        env:
          CLAWPATCH_SUPERVISE_SOURCE: .
          CLAWPATCH_SUPERVISE_HOME: ${{ runner.temp }}/clawpatch-supervise
          CLAWPATCH_SUPERVISE_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          bash scripts/install.sh
          "${CLAWPATCH_SUPERVISE_BIN_DIR}/clawpatch-supervise" --version
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1 -Source . -InstallRoot "${{ runner.temp }}\clawpatch-supervise" -BinDir "${{ runner.temp }}\bin"
          & "${{ runner.temp }}\bin\clawpatch-supervise.cmd" --version

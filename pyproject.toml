[build-system]
requires = ["setuptools==84.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clawpatch-supervise"
dynamic = ["version"]
description = "The external queue runtime behind Manageroo's ClawPatch workflow: exact checkpoints, bounded retries, verified repairs, and completion proof."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Uncle Matt"}]
keywords = ["clawpatch", "codex", "code-review", "repair", "supervisor"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
clawpatch-supervise = "clawpatch_supervise.clawpatch_external:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "clawpatch_supervise.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
